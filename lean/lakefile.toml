# A Lake package of proofs about compiled Go, checked by janus verify.
name = "fv256"
defaultTargets = ["Fv256"]

[[require]]
name = "janus"
git = "https://github.com/Giulio2002/Janus"
rev = "8304911078076875d0007cf0dc03677a05e19c8a"

# Fv256.lean imports the modules that do not depend on an extraction (specifications and
# lemmas), so lake build builds and checks them. Theorem modules import Extracted, which
# janus verify supplies from an artifact directory: check those with janus verify.
[[lean_lib]]
name = "Fv256"
